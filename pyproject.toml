[project]
name = "cells2table"
version = "0.4.1"
description = "Table image parsing with cell detection models"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "jspast", email = "140563347+jspast@users.noreply.github.com" }
]
keywords = ["docling", "plugin"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy (>=2.2.0,<3.0.0)"]

[project.urls]
Homepage = "https://github.com/jspast/cells2table"
Issues = "https://github.com/jspast/cells2table/issues"

[project.scripts]
cells2table = "cells2table.cli:main"
cells2table-download = "cells2table.cli:download"

[project.entry-points.docling]
cells2table = "cells2table.docling.table"
ppdoclayoutv3 = "cells2table.docling.layout"

[project.optional-dependencies]
huggingface = [
  "huggingface-hub (>=0.36.0,<2.0.0)",
]
onnxruntime = ["onnxruntime (>=1.23.2,<2.0.0)"]
opencv = ["opencv-python (>=5.0.0.0,<6.0.0.0)"]
opencv-headless = ["opencv-python-headless (>=5.0.0.0,<6.0.0.0)"]
transformers = ["transformers (>=5.8.1,<6.0.0)"]

[dependency-groups]
dev = [
  "cells2table[onnxruntime,transformers,opencv]",
  "docling (>=2.66.0,<3.0.0)",
  "pytest (>=7.0,<10.0)",
  "ruff (>=0.5.0,<1.0.0)",
  "torch (>=2.11.0,<3.0.0)",
  "torchvision (>=0.26.0,<1.0.0)",
  "ty (>=0.0.65,<1.0.0)",
]

[build-system]
requires = ["uv_build>=0.9.17,<1.0.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ty.terminal]
output-format = "concise"

[tool.uv]
package = true
prerelease = "if-necessary"
conflicts = [
  [
    { extra = "opencv-headless" },
    { extra = "opencv" },
  ]
]

[tool.uv.build-backend]
module-name = "cells2table"
module-root = ""

[tool.uv.sources]
torch = { index = "torch_cpu" }
torchvision = { index = "torch_cpu" }

[[tool.uv.index]]
name = "torch_cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
